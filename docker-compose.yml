version: '3.8'
services:
  wealth-postgres:
    image: postgres:15
    container_name: wealth-postgres
    environment:
      POSTGRES_USER: wealth_user
      POSTGRES_PASSWORD: wealth_pass
      POSTGRES_DB: wealth_db
    ports:
      - "5435:5432"
    volumes:
      - wealth_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  wealth_postgres_data:
